<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Small-size cut of the mark: heavier stroke and a wider eye so it survives 16/32px. -->
  <defs>
    <mask id="eye" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect width="128" height="128" fill="#fff"/>
      <rect x="37" y="28" width="6" height="18" rx="3" fill="#000"/>
    </mask>
  </defs>
  <g transform="translate(64 64) scale(1.3) translate(-62.5 -63)" mask="url(#eye)" fill="none" stroke="#CC3A64" stroke-width="16">
    <line x1="40" y1="27" x2="40" y2="99" stroke-linecap="round"/>
    <circle cx="66" cy="80" r="19"/>
  </g>
</svg>
